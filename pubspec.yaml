name: study_vault
description: "A local-first study application for organizing classes, subjects, and lessons."
publish_to: 'none'
version: 4.0.0+5000

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  drift: ^2.26.0
  sqlite3_flutter_libs: ^0.5.32
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  file_picker: ^8.3.7
  pdfrx: ^2.4.8
  image: ^4.5.4
  flutter_quill: ^11.6.0
  intl: ^0.20.2
  archive: ^4.3.0
  crypto: ^3.0.6
  share_plus: ^10.1.4
  http: ^1.6.0
  flutter_secure_storage: ^10.3.4
  shared_preferences: ^2.5.5
  flutter_markdown: ^0.7.7+1
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.26.0
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/logo/study_vault_icon_1024.png
  adaptive_icon_background: "#1B4F72"
  adaptive_icon_foreground: assets/logo/study_vault_icon_1024.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/logo/study_vault_logo_512.png
    - assets/logo/study_vault_icon_512.png
    - assets/logo/study_vault_icon_1024.png
    - manual_entry_instruction.md
